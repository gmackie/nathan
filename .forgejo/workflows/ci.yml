name: Nathan CI
# ForgeGraph runners (git.forgegraf.com). Mirrors .github/workflows/ci.yml without artifact uploads,
# which Forgejo runners do not support. Keep the two in step.
on:
  push:
    branches: [main, feat/**]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the original naming illustration
        run: echo 'ee83ade5d1023fca1892d0a7c0d86d7348a47b3077106d7f16b97d578f3a9920  assets/naming-origin.png' | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify static marketing site and cost scenarios
        run: npm run verify:site
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Better Auth SQL schema
        run: npm run schema:generate
      - name: Verify committed Better Auth schema is in sync
        run: git diff --exit-code -- migrations/0002_better_auth.sql
      - name: Unit tests
        run: npm test
      - name: Static types
        run: npm run typecheck
      - name: Auth Worker bundle (no deployment)
        run: npm run build:auth
      - name: Gateway Worker bundle (no deployment)
        run: npm run build:gateway
      - name: Workers runtime tests (built bundles in workerd)
        run: npm run test:runtime
      - name: Pack pinned IdP release into hosted installer
        run: npm run pack:release
      - name: Verify release manifest and every package hash
        run: npm run verify:release
      - name: Hosted installer Worker bundle (no deployment)
        run: npm run build:installer
