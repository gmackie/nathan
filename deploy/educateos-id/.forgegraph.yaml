app: educateos-id
server: https://forgegraf.com
deploymentPlatform: cloudflare-workers
stages:
  - name: staging
    sortOrder: 10
    targets:
      - name: auth
        platform: cloudflare-workers
        config:
          appDir: .
          workerName: nathan-educateos-stg-auth
          keepCrons: true
          buildCommand: pnpm import && pnpm install --frozen-lockfile && node deploy/educateos-id/cloudflare.config.ts --check
          deployCommand: >-
            pnpm exec wrangler d1 migrations apply DB --remote --config deploy/educateos-id/wrangler.auth.jsonc &&
            pnpm exec wrangler deploy --config deploy/educateos-id/wrangler.auth.jsonc
          syncSecrets: true
