name: Nathan CI
on:
  push:
    branches: [main, feat/**]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Static types
        run: npm run typecheck
      - name: Auth Worker bundle (no deployment)
        run: npm run build:auth
      - name: Gateway Worker bundle (no deployment)
        run: npm run build:gateway
